[package]
name = "spotnowplay"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["system-proxy", "json", "query"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "macros"] }
tokio-tungstenite = "0.30"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
serde-enum-str = "0.3"

[features]
default = ["discord_integration", "rustls-tls"]
discord_integration = []
native-tls = ["tokio-tungstenite/native-tls", "reqwest/native-tls"]
rustls-tls = ["tokio-tungstenite/rustls-tls-webpki-roots", "reqwest/rustls"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.2"
